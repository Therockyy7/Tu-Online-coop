<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tu Online — Xem thử</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1b1f; font-family: system-ui, sans-serif; }
      #stage { position: fixed; inset: 0; }
      #ui { position: fixed; inset: 0; pointer-events: none; }
      #ui > * { pointer-events: auto; }
      #preview-nav { position: fixed; left: 8px; top: 8px; z-index: 50; background: #fffe; border-radius: 8px; padding: 6px 10px; font-size: 13px; }
      #preview-nav a { margin-right: 8px; color: #6e3b26; }
      #preview-panel { position: fixed; right: 8px; top: 8px; z-index: 50; background: #fffe; border-radius: 8px; padding: 8px; max-height: 90vh; overflow: auto; font-size: 13px; display: grid; gap: 4px; }
      #preview-panel:empty { display: none; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="ui"></div>
    <nav id="preview-nav"></nav>
    <div id="preview-panel"></div>
    <script type="module" src="./src/preview/main.ts"></script>
  </body>
</html>
